<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
$if(noindex)$
<meta name="robots" content="noindex, nofollow">
$endif$
<title>$pagetitle$</title>
<link rel="stylesheet" href="$root$style.css?v=$cssver$">
$if(math)$
$math$
$endif$
</head>
<body>
<header class="top">
  <a class="brand" href="$root$">FMC case studies</a>
  <nav>
$if(study)$
    <a href="./"$if(is-writeup)$ class="here"$endif$>Write-up</a>
$if(has-examples)$
    <a href="examples.html"$if(is-examples)$ class="here"$endif$>Examples</a>
$endif$
$if(has-errata)$
    <a href="errata.html"$if(is-errata)$ class="here"$endif$>Errata</a>
$endif$
$endif$
    <a href="$root$search.html"$if(is-search)$ class="here"$endif$>Search</a>
    <a href="https://github.com/ArhanChaudhary/fmc-analysis">Source</a>
  </nav>
$if(is-search)$
$else$
  <form class="search" role="search" action="$root$search.html">
    <input type="search" name="q" placeholder="Search the site" aria-label="Search the site">
  </form>
$endif$
</header>
<div class="layout$if(is-home)$ home$elseif(toc)$$else$ notoc$endif$">
$if(is-home)$
$elseif(toc)$
  <aside class="toc">
    <details open>
      <summary>On this page</summary>
      $toc$
    </details>
  </aside>
$endif$
  <main>
    <h1 class="title">$title$</h1>
$body$
  </main>
</div>
</body>
</html>
