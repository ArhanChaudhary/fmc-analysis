[package]
name = "attempt-sim-cli"
version = "0.2.0"
edition = "2021"
publish = false

[[bin]]
name = "attempt-sim"
path = "src/main.rs"

[dependencies]
attempt-sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", features = ["preserve_order"] }
