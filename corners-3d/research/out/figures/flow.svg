<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" role="img" aria-label="Flow chart: reading the corners for a floor and for the next turn" style="max-width:100%;height:auto;color:var(--fg);font:14px system-ui,sans-serif" fill="currentColor"><title>Flow chart: reading the corners for a floor and for the next turn</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs><rect x="20" y="20" width="330" height="64" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="185.0" y="49.0" text-anchor="middle" font-weight="650">1. Type every corner</text><text x="185.0" y="64.0" text-anchor="middle">3 oriented stickers: good. 1: out. 0: twisted.</text><rect x="20" y="130" width="330" height="64" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="185.0" y="166.5" text-anchor="middle" font-weight="650">2. Are they all good?</text><rect x="20" y="240" width="330" height="64" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="185.0" y="269.0" text-anchor="middle" font-weight="650">3. Count twisted, and out per axis</text><text x="185.0" y="284.0" text-anchor="middle">The count table gives a floor.</text><rect x="20" y="350" width="330" height="64" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="185.0" y="379.0" text-anchor="middle" font-weight="650">4. Can you see how to make them</text><text x="185.0" y="394.0" text-anchor="middle">all good in 4 turns or less?</text><rect x="20" y="460" width="330" height="78" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="185.0" y="488.5" text-anchor="middle" font-weight="650">5. Further out</text><text x="185.0" y="503.5" text-anchor="middle">The types don't tell the closer turn.</text><text x="185.0" y="518.5" text-anchor="middle">Cut with the floors, then search.</text><line x1="185.0" y1="84.0" x2="185.0" y2="130.0" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><line x1="185.0" y1="194.0" x2="185.0" y2="240.0" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><line x1="185.0" y1="304.0" x2="185.0" y2="350.0" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><line x1="185.0" y1="414.0" x2="185.0" y2="460.0" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><text x="195.0" y="222.0" text-anchor="start" font-size="12">no</text><text x="195.0" y="442.0" text-anchor="start" font-size="12">no</text><rect x="420" y="110" width="280" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="560.0" y="144.0" text-anchor="middle">D-colour corners in a 4a picture,</text><text x="560.0" y="159.0" text-anchor="middle">and parity even?</text><text x="560.0" y="174.0" text-anchor="middle">Yes: HTR.</text><text x="560.0" y="189.0" text-anchor="middle">No: fake HTR, exactly 9 moves away.</text><line x1="350.0" y1="162.0" x2="420.0" y2="162.0" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><text x="384.0" y="154.0" text-anchor="middle" font-size="12">yes</text><rect x="420" y="330" width="280" height="104" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="560.0" y="364.0" text-anchor="middle">That is the shortest way to all good.</text><text x="560.0" y="379.0" text-anchor="middle">It ends in HTR for 1 state in 6</text><text x="560.0" y="394.0" text-anchor="middle">that look like yours: check the end</text><text x="560.0" y="409.0" text-anchor="middle">the way step 2 does.</text><line x1="350.0" y1="382.0" x2="420.0" y2="382.0" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><text x="384.0" y="374.0" text-anchor="middle" font-size="12">yes</text></svg>