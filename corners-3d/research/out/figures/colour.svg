<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" role="img" aria-label="The D-colour corners: pictures, and where a quarter turn can take them" style="max-width:100%;height:auto;color:var(--fg);font:14px system-ui,sans-serif" fill="currentColor"><title>The D-colour corners: pictures, and where a quarter turn can take them</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs><rect x="30" y="110" width="130" height="64" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="95.0" y="131.5" text-anchor="middle" font-weight="650">4d</text><text x="95.0" y="146.5" text-anchor="middle">4 and 0</text><text x="95.0" y="161.5" text-anchor="middle">at least 1 qt</text><rect x="200" y="110" width="130" height="64" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="265.0" y="131.5" text-anchor="middle" font-weight="650">4a</text><text x="265.0" y="146.5" text-anchor="middle">2 and 2, HTR-like</text><text x="265.0" y="161.5" text-anchor="middle">0 qt</text><rect x="380" y="110" width="130" height="64" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="445.0" y="131.5" text-anchor="middle" font-weight="650">4b</text><text x="445.0" y="146.5" text-anchor="middle">2 and 2, bars</text><text x="445.0" y="161.5" text-anchor="middle">at least 1 qt</text><rect x="560" y="110" width="130" height="64" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="625.0" y="131.5" text-anchor="middle" font-weight="650">4c</text><text x="625.0" y="146.5" text-anchor="middle">3 and 1</text><text x="625.0" y="161.5" text-anchor="middle">at least 2 qt</text><line x1="160.0" y1="142.0" x2="200.0" y2="142.0" stroke="currentColor" stroke-width="1.2"/><line x1="330.0" y1="142.0" x2="380.0" y2="142.0" stroke="currentColor" stroke-width="1.2"/><line x1="510.0" y1="142.0" x2="560.0" y2="142.0" stroke="currentColor" stroke-width="1.2"/><path d="M 251.0 110 C 235.0 76, 295.0 76, 279.0 110" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="265.0" y="80.0" text-anchor="middle" font-size="12" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" fill="var(--bg)">can stay</text><text x="265.0" y="80.0" text-anchor="middle" font-size="12">can stay</text><path d="M 611.0 110 C 595.0 76, 655.0 76, 639.0 110" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="625.0" y="80.0" text-anchor="middle" font-size="12" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" fill="var(--bg)">can stay</text><text x="625.0" y="80.0" text-anchor="middle" font-size="12">can stay</text><text x="360.0" y="235.0" text-anchor="middle" font-size="12">Count the four corners that carry the D colour (DBL is one) by tetrad: 2 and 2, 3 and 1, or 4 and 0.</text><text x="360.0" y="253.0" text-anchor="middle" font-size="12">4a: the two pairs sit on the same face or on opposite faces. One line = one quarter turn of R, U or F.</text><text x="360.0" y="271.0" text-anchor="middle" font-size="12">These are rodneykinney's UD labels with the same 0, 1, 2, 1 quarter turns: nothing changes off the DR axis.</text></svg>