<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" role="img" aria-label="Every kind of corner pattern within two quarter turns of HTR" style="max-width:100%;height:auto;color:var(--fg);font:14px system-ui,sans-serif" fill="currentColor"><title>Every kind of corner pattern within two quarter turns of HTR</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs><text x="130.0" y="22.0" text-anchor="middle" font-weight="650">2 quarter turns</text><text x="380.0" y="22.0" text-anchor="middle" font-weight="650">1 quarter turn</text><text x="640.0" y="22.0" text-anchor="middle" font-weight="650">HTR</text><rect x="20" y="40" width="230" height="70" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="135.0" y="64.5" text-anchor="middle" font-weight="650">4 out (4a)</text><text x="135.0" y="79.5" text-anchor="middle">R' U2 R2 F2 R'</text><text x="135.0" y="94.5" text-anchor="middle">really 2 qt: 1 of 6</text><rect x="20" y="124" width="230" height="70" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="135.0" y="148.5" text-anchor="middle" font-weight="650">4 out (4b)</text><text x="135.0" y="163.5" text-anchor="middle">F' R2 F</text><text x="135.0" y="178.5" text-anchor="middle">really 2 qt: 2 of 6</text><rect x="20" y="208" width="230" height="70" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="135.0" y="232.5" text-anchor="middle" font-weight="650">2 + 2 out, 2 twisted</text><text x="135.0" y="247.5" text-anchor="middle">F U2 R</text><text x="135.0" y="262.5" text-anchor="middle">really 2 qt: 1 of 6</text><rect x="20" y="292" width="230" height="70" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="135.0" y="316.5" text-anchor="middle" font-weight="650">2 + 2 out, 2 twisted</text><text x="135.0" y="331.5" text-anchor="middle">R' F'</text><text x="135.0" y="346.5" text-anchor="middle">really 2 qt: 1 of 6</text><rect x="20" y="376" width="230" height="70" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="135.0" y="400.5" text-anchor="middle" font-weight="650">4 twisted</text><text x="135.0" y="415.5" text-anchor="middle">U F2 U2 F'</text><text x="135.0" y="430.5" text-anchor="middle">really 2 qt: 1 of 6</text><rect x="300" y="208" width="200" height="70" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="400.0" y="232.5" text-anchor="middle" font-weight="650">4 out (4a)</text><text x="400.0" y="247.5" text-anchor="middle">U'</text><text x="400.0" y="262.5" text-anchor="middle">really 1 qt: 1 of 6</text><rect x="560" y="208" width="140" height="70" rx="6" fill="var(--soft)" stroke="currentColor" stroke-width="1.2"/><text x="630.0" y="232.5" text-anchor="middle" font-weight="650">all good</text><text x="630.0" y="247.5" text-anchor="middle">really HTR:</text><text x="630.0" y="262.5" text-anchor="middle">1 of 6</text><line x1="250.0" y1="75.0" x2="300.0" y2="243.0" stroke="currentColor" stroke-width="1.2"/><line x1="250.0" y1="159.0" x2="300.0" y2="243.0" stroke="currentColor" stroke-width="1.2"/><line x1="250.0" y1="243.0" x2="300.0" y2="243.0" stroke="currentColor" stroke-width="1.2"/><line x1="250.0" y1="327.0" x2="300.0" y2="243.0" stroke="currentColor" stroke-width="1.2"/><line x1="250.0" y1="411.0" x2="300.0" y2="243.0" stroke="currentColor" stroke-width="1.2"/><line x1="500.0" y1="243.0" x2="560.0" y2="243.0" stroke="currentColor" stroke-width="1.2"/><text x="360.0" y="478.0" text-anchor="middle" font-size="12">Each box: what you count, a scramble that makes it, and how many of the six states that look</text><text x="360.0" y="494.0" text-anchor="middle" font-size="12">alike are that close. One line = one quarter turn, after half turns to set it up.</text></svg>